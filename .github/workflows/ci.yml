name: EventFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t eventflow:ci .

  lambda-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build/lambda
          cp lambda/handler.py build/lambda/
          cd build/lambda
          zip -r ../../eventflow-lambda.zip .

  smoke-test:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t eventflow:smoke .
          docker run -d --name eventflow-smoke -p 8000:8000 eventflow:smoke
          sleep 5
          curl --fail http://localhost:8000/docs
          docker rm -f eventflow-smoke
